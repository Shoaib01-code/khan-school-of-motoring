<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khan School of Motoring</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f5f7;
        font-family: Arial, sans-serif;
      }

      .card {
        background: #ffffff;
        max-width: 700px;
        padding: 40px 32px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        text-align: center;
      }

      h1 {
        margin-bottom: 16px;
        color: #1f2937;
      }

      p {
        color: #374151;
        font-size: 18px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Khan School of Motoring</h1>
      <p>
        Welcome to Khan School of Motoring, where confidence on the road begins with patient guidance,
        professional instruction, and practical driving lessons designed to help every learner succeed.
      </p>
    </div>
  </body>
</html>
